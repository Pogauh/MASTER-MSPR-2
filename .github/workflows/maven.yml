name: Java CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code
      - uses: actions/checkout@v3

      # 2. Installer Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Vérifier la version de Java
      - name: Check Java version
        run: java -version

      # 4. Build et tests Maven
      - name: Build with Maven
        run: mvn clean install
