name: CI Development

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run all tests and build
        run: mvn clean verify

      # Rapport de couverture JaCoCo (tests unitaires + tests d'intégration) : à télécharger depuis l'onglet Actions
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 7

      # Entrées de l'analyse SonarQube (job "sonar" ci-dessous, désactivé par défaut)
      - name: Upload SonarQube analysis inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-inputs-${{ github.run_id }}
          path: |
            target/classes
            target/test-classes
            target/site/jacoco
            target/surefire-reports
            target/failsafe-reports
          retention-days: 1

  # Analyse SonarQube : DÉSACTIVÉE par défaut.
  # Ne s'exécute que si la variable de dépôt SONAR_ENABLED vaut 'true' (voir sonar.yml pour les prérequis).
  sonar:
    needs: test-and-build
    if: ${{ vars.SONAR_ENABLED == 'true' && always() && !cancelled() }}
    uses: ./.github/workflows/sonar.yml
    with:
      artifact: sonar-inputs-${{ github.run_id }}
    secrets: inherit
