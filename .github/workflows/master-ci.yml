name: Mise en production - Master CI

on:
  push:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run all tests and build
        run: mvn clean verify

      # Rapport de couverture JaCoCo (tests unitaires + tests d'intégration) : à télécharger depuis l'onglet Actions
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 7

      # Entrées de l'analyse SonarQube (job "sonar" ci-dessous, désactivé par défaut)
      - name: Upload SonarQube analysis inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-inputs-${{ github.run_id }}
          path: |
            target/classes
            target/test-classes
            target/site/jacoco
            target/surefire-reports
            target/failsafe-reports
          retention-days: 1

      - name: Extract Maven version
        id: project_version
        run: mvn help:evaluate -Dexpression=project.version -q -DforceStdout > version.txt

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-backend
          path: |
            target/*.jar
            version.txt
          retention-days: 1

  # Analyse SonarQube : DÉSACTIVÉE par défaut.
  # Ne s'exécute que si la variable de dépôt SONAR_ENABLED vaut 'true' (voir sonar.yml pour les prérequis).
  sonar:
    needs: build
    if: ${{ vars.SONAR_ENABLED == 'true' && always() && !cancelled() }}
    uses: ./.github/workflows/sonar.yml
    with:
      artifact: sonar-inputs-${{ github.run_id }}
    secrets: inherit

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: api-backend
          path: .

      - name: Read version
        id: read_version
        run: echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            selimdrici/backend_future_kawa:latest
            selimdrici/backend_future_kawa:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max