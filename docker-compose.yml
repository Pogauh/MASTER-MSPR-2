version: '3.8'

services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: futurekawa-mqtt-local
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always

  db-sql:
    image: postgres:15-alpine
    container_name: futurekawa-db-local
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: futurekawa_country
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  db-admin:
    image: adminer
    container_name: futurekawa-adminer
    ports:
      - "8081:8080"
    restart: always

  backend-app:
    image: selimdrici/backend_future_kawa:latest
    container_name: futurekawa-backend
    restart: always
    depends_on:
      - db-sql
      - mqtt-broker
    ports:
      - "8080:8080"
    environment:
      # Injection les variables du application.yml
      DB_HOST: db-sql
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: password123
      MQTT_BROKER_URI: tcp://mqtt-broker:1883

      # écraser le topic ici si besoin :
      # MQTT_TOPIC: futurekawa/bresil/entrepot1/data
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup futurekawa-backend
    restart: always

volumes:
  postgres_data: