spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_bresil}
    username: ${DB_USER:admin_bresil}
    password: ${DB_PASSWORD:password_bresil}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST:in-v3.mailjet.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  mail:
    responsable: ${MAIL_RESPONSABLE:ultrabaga@hotmail.com}
    from: ${MAIL_FROM:ultrabaga@hotmail.com}

  apiName: ${API_NAME:bresil}
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}
    # Capteurs réels à ne jamais simuler (identifiants séparés par des virgules ; vide = tout simuler).
    # Par défaut : le capteur du module IoT (ESP32), zone AF de l'entrepôt principal.
    excluded-capteurs: ${SIMULATOR_EXCLUDED_CAPTEURS:4da39f51-970b-4b9d-9a2a-d092af0d10f2}
  alert:
    tolerences:
      temperature-ideale: ${TEMPERATURE_IDEALE:29}
      humidite-ideale: ${HUMIDITE_IDEALE:55}
      tolerance-temperature: ${TOLERANCE_TEMPERATURE:3}
      tolerance-humidite: ${TOLERANCE_HUMIDITE:2}

springdoc:
  openapi:
    title: FutureKawa API - Backend
    description: API documentation for FutureKawa Backend

mqtt:
  enabled: ${MQTT_ENABLED:true}
  broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
  topic: ${MQTT_TOPIC:futurekawa/bresil/entrepot1/data}
  outbound-default-topic: ${MQTT_OUTBOUND_DEFAULT_TOPIC:futurekawa/default}

server:
  error:
    include-message: always
