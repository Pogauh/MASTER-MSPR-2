spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:db_bresil}
    username: ${DB_USER:admin_bresil}
    password: ${DB_PASSWORD:password_bresil}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  alert:
    tolerences:
      temperature-ideale: ${TEMPERATURE_IDEALE:29}
      humidite-ideale: ${HUMIDITE_IDEALE:55}
      tolerance-temperature: ${TOLERANCE_TEMPERATURE:3}
      tolerance-humidite: ${TOLERANCE_HUMIDITE:2}

springdoc:
  openapi:
    title: FutureKawa API - Backend
    description: API documentation for FutureKawa Backend

mqtt:
  broker-uri: ${MQTT_BROKER_URI:tcp://localhost:1883}
  topic: ${MQTT_TOPIC:futurekawa/bresil/entrepot1/data}
  outbound-default-topic: ${MQTT_OUTBOUND_DEFAULT_TOPIC:futurekawa/default}

server:
  error:
    include-message: always